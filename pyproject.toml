[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-studies"
version = "1.0.0"
description = "Measurement studies of online chess on chess.com and Lichess, built on one shared crawler and one fixed engine."
requires-python = ">=3.10"

# Dependencies and their versions live in requirements.txt, which carries the
# reason for each one. They are deliberately not repeated here: two lists of the
# same pins drift apart.

[project.scripts]
elo-drift = "elo_drift.cli:main"

# The shared package lives in src/, each study's package in studies/<name>/src/.
[tool.setuptools.packages.find]
where = ["src", "studies/elo-drift/src"]

[tool.pytest.ini_options]
testpaths = ["tests", "studies/elo-drift/tests"]
pythonpath = ["src", "studies/elo-drift/src"]

[tool.ruff]
line-length = 100
target-version = "py310"
